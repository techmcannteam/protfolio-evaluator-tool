[project]
name = "mccann-portfolio-evaluator"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.141.1", "psycopg[binary]==3.3.4", "requests==2.34.2", "uvicorn[standard]==0.52.4", "email-validator>=2.2,<3"]
[dependency-groups]
dev = ["pytest==8.4.2", "httpx>=0.28,<1", "ruff>=0.14,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.vercel]
entrypoint = "backend.main:app"
